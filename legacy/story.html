<section class="st-scroll" aria-label="The climb">
<figure class="st-stage">
<canvas data-story aria-hidden="true"></canvas>
<figcaption class="st-sr">A man climbs a long concrete staircase in a dark hall toward a tall opening filled with soft daylight. He stops six times on the way, on the steps and on the landings, to look up, glance aside or look down at the next step, then continues. The space grows lighter as he rises.</figcaption>
<div class="st-shade"></div>
<div class="st-col st-intro" data-intro>
<p class="st-kicker">02 — Story</p>
<h1 class="st-title">The climb.</h1>
</div>
<ol class="st-col st-steps" data-frags>
<li class="st-step"><div class="st-inner"><p class="st-num">Step 1</p><h2 class="st-h">Where It All Began</h2><div class="st-body"><p>My story began after three years of studying Computer Science in a hands-on academic environment, at the College of Computer, Control, and Automation Engineering.</p></div></div></li>
<li class="st-step"><div class="st-inner"><p class="st-num">Step 2</p><h2 class="st-h">Searching for Meaning</h2><div class="st-body"><p>Throughout those years, I kept asking myself a question:</p><p class="st-q">How could I create real value from everything I was learning?</p><p>I wasn’t just looking for knowledge. I wanted to put that knowledge into practice.</p><p>I wanted to grow, to improve, and to become the best version of myself.</p></div></div></li>
<li class="st-step"><div class="st-inner"><p class="st-num">Step 3</p><h2 class="st-h">A Turning Point</h2><div class="st-body"><p>My curiosity, combined with advice from a friend in the same field, encouraged me to take a different path.</p><p>I decided to change the way I used my time and energy.</p><p>I wanted to move from being someone who wasted his potential to someone who was disciplined, curious, and committed to continuous learning.</p></div></div></li>
<li class="st-step"><div class="st-inner"><p class="st-num">Step 4</p><h2 class="st-h">My First Step</h2><div class="st-body"><p>About two years ago, I took my first step toward becoming a software engineer.</p><p>I began studying technologies and systems, building projects, and learning from what I created.</p><p>I wanted to understand not only how things worked, but also why they worked that way.</p><p>And as technology continued to evolve, I tried to keep learning and adapting.</p></div></div></li>
<li class="st-step"><div class="st-inner"><p class="st-num">Step 5</p><h2 class="st-h">The Journey</h2><div class="st-body"><p>The road wasn’t easy.</p><p>It was challenging, uncertain, and often unclear.</p><p>There were things I didn’t understand, problems I didn’t know how to solve, and moments when progress felt slower than I expected.</p><p>But every challenge taught me something.</p><p>Little by little, the journey helped me build discipline, develop a deeper curiosity, and become more committed to growth.</p></div></div></li>
<li class="st-step"><div class="st-inner"><p class="st-num">Step 6</p><h2 class="st-h">The Goal</h2><div class="st-body"><p>My goal was never just to become a software engineer.</p><p>I wanted to become an engineer who understands the systems he builds, learns from his mistakes, and keeps improving his skills.</p><p>An engineer who doesn’t stop at what he already knows, but continues exploring what he can learn next.</p><p>And this journey is still going on.</p><p>I’m still learning, still building, and still working toward becoming the best version of myself as an engineer.</p></div></div></li>
</ol>
